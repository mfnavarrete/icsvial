<section class="py-5 bg-light border-bottom">
  <div class="container py-3 py-md-4">
    <a class="btn btn-outline-dark btn-sm mb-3" routerLink="/blog">
      <i class="bi bi-arrow-left"></i>
      Volver a blogs
    </a>

    @if (isLoading) {
      <div class="d-flex align-items-center gap-3" role="status">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <span class="text-secondary">Cargando blog...</span>
      </div>
    } @else if (errorMessage) {
      <div class="alert alert-danger mb-0" role="alert">
        {{ errorMessage }}
      </div>
    } @else if (post) {
      <article class="card border-0 shadow-sm overflow-hidden">
        <img
          class="blog-cover"
          [src]="getImageUrl(post.imagen)"
          [alt]="post.titulo"
          width="1280"
          height="720"
        />
        <div class="card-body p-4 p-md-5">
          <h1 class="display-6 fw-bold mb-2">{{ post.titulo }}</h1>
          <p class="text-muted mb-4">{{ getAuthorLabel(post.autor) }}</p>
          <p class="lead text-secondary">{{ post.descripcion }}</p>
          <hr class="my-4" />
          <div class="blog-content" [innerHTML]="contentHtml"></div>
        </div>
      </article>
    }
  </div>
</section>
