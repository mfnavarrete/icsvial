<app-page-hero [title]="title" [backgroundImage]="heroBackgroundImage"></app-page-hero>

<section class="py-5">
  <div class="container">
    @if (isLoading) {
      <div class="d-flex align-items-center gap-3" role="status">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <span class="text-secondary">Cargando publicaciones...</span>
      </div>
    } @else if (errorMessage) {
      <div class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>
    } @else {
      <app-blog-list [posts]="posts" [emptyMessage]="emptyMessage"></app-blog-list>
    }
  </div>
</section>
