<app-page-hero [title]="title" [backgroundImage]="heroBackgroundImage"></app-page-hero>

<section class="contact-panel pb-5">
  <div class="container">
    <article class="contact-card shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="row g-0">
        <div class="col-12 col-lg-5">
          <div class="contact-info p-4 p-md-5 h-100">
            <h2 class="display-6 fw-bold mb-3">{{ contactCardTitle }}</h2>
            <p class="text-secondary mb-4">{{ contactCardText }}</p>

            <div class="d-grid gap-3">
              <div class="d-flex align-items-start gap-3">
                <span class="contact-icon"><i class="bi bi-geo-alt"></i></span>
                <div>
                  <h3 class="h4 mb-1">{{ officeTitle }}</h3>
                  <p class="mb-0 text-secondary">{{ officeAddress }}</p>
                </div>
              </div>

              <div class="d-flex align-items-start gap-3">
                <span class="contact-icon"><i class="bi bi-envelope"></i></span>
                <div>
                  <h3 class="h4 mb-1">{{ emailTitle }}</h3>
                  <p class="mb-0 text-secondary">{{ email }}</p>
                </div>
              </div>

              <div class="d-flex align-items-start gap-3">
                <span class="contact-icon"><i class="bi bi-telephone"></i></span>
                <div>
                  <h3 class="h4 mb-1">{{ phoneTitle }}</h3>
                  <p class="mb-0 text-secondary">{{ phone }}</p>
                </div>
              </div>
            </div>

            <hr class="my-4" />

            <h4 class="h5 fw-semibold mb-3">{{ socialTitle }}</h4>
            <div class="d-flex align-items-center gap-2">
              <a
                class="social-link"
                href="https://www.facebook.com/ics.vial#"
                aria-label="Facebook"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="bi bi-facebook" aria-hidden="true"></i>
              </a>
              <a
                class="social-link"
                href="https://www.instagram.com/ics_vial"
                aria-label="Instagram"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="bi bi-instagram" aria-hidden="true"></i>
              </a>
              <a
                class="social-link"
                href="https://www.tiktok.com/@icsvial?_r=1&_t=ZS-947OlyizHuc"
                aria-label="TikTok"
                target="_blank"
                rel="noopener noreferrer"
              >
                <i class="bi bi-tiktok" aria-hidden="true"></i>
              </a>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="map-wrapper h-100 position-relative">
            <iframe
              class="contact-map"
              [title]="title"
              [src]="mapLocationUrl"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
            <a
              class="btn btn-dark map-cta"
              [href]="mapCtaLink"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ mapCtaText }}
            </a>
          </div>
        </div>
      </div>
    </article>
  </div>
</section>
